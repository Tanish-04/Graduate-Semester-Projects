  <script>
    let expandedRegions = new Set(); 
    let highlightedCountry = null;
    let highlightedCategory = null;
    let unknownCountries = new Set();
    
    let allCountriesForSearch = [];
    let searchResultsVisible = false;
    
    const standardRegions = [

    const colorScale = d3.scaleOrdinal()
      .domain(standardRegions)
      .range(colorPalette);
    
    const countryToContinentMap = {

      "Algeria": "Africa", "Angola": "Africa", "Benin": "Africa", "Botswana": "Africa",

      "Niger": "Africa", "Nigeria": "Africa", "Rwanda": "Africa", "Sao Tome and Principe": "Africa", 
      "Senegal": "Africa", "Seychelles": "Africa", "Sierra Leone": "Africa", "Somalia": "Africa", 
      "South Africa": "Africa", "South Sudan": "Africa", "Sudan": "Africa", "Tanzania": "Africa", 
      "Togo": "Africa", "Tunisia": "Africa", "Uganda": "Africa", "Zambia": "Africa", 
      "Zimbabwe": "Africa", "Egypt": "Africa", "Libya": "Africa",
      
      "Bahrain": "Middle East", "Iran": "Middle East", "Iraq": "Middle East", 
      "Israel": "Middle East", "Jordan": "Middle East", 
      "Kuwait": "Middle East", "Lebanon": "Middle East", "Oman": "Middle East", 
      "Qatar": "Middle East", "Saudi Arabia": "Middle East", "Syria": "Middle East", 
      "Turkey": "Middle East", "United Arab Emirates": "Middle East", "Yemen": "Middle East",
      
      "Afghanistan": "Asia", "Armenia": "Asia", "Azerbaijan": "Asia", "Bangladesh": "Asia", 
      "Bhutan": "Asia", "Brunei": "Asia", "Cambodia": "Asia", "China": "Asia", 
      "Georgia": "Asia", "India": "Asia", "Indonesia": "Asia", "Japan": "Asia", 
      "Kazakhstan": "Asia", "North Korea": "Asia", "South Korea": "Asia", 
      "Kyrgyzstan": "Asia", "Laos": "Asia", "Malaysia": "Asia", "Maldives": "Asia", "Mongolia": "Asia", 
      "Myanmar": "Asia", "Nepal": "Asia", "Pakistan": "Asia", 
      "Philippines": "Asia", "Singapore": "Asia", "Sri Lanka": "Asia", "Taiwan": "Asia", 
      "Tajikistan": "Asia", "Thailand": "Asia", "Timor-Leste": "Asia",

      "Australia": "Australia and Oceania", "Fiji": "Australia and Oceania", 
      "Kiribati": "Australia and Oceania", "Marshall Islands": "Australia and Oceania", 
      "Micronesia": "Australia and Oceania",

      "Palau": "Australia and Oceania", "Papua New Guinea": "Australia and Oceania", 
      "Samoa": "Australia and Oceania", "Solomon Islands": "Australia and Oceania", 
      "Tonga": "Australia and Oceania", "Tuvalu": "Australia and Oceania", 
      "Vanuatu": "Australia and Oceania"
    };
    
    function logUnknownCountries(countryName) {
      if (!countryToContinentMap[countryName] && 
          countryName !== "World" && 
          countryName !== "Unassigned" && 
          countryName !== "Other Countries") {
        unknownCountries.add(countryName);
        console.log(`Unknown country: ${countryName}`);
      }
    }
    
    function getContinent(countryName) {
      if (!countryName) return "Unassigned";
      
      if (countryName === "World" || countryName === "Unassigned") {
        return null; 
      }
      
      if (countryToContinentMap[countryName]) {
        return countryToContinentMap[countryName];
      }
      
      const normalizedName = countryName
        .replace(/\s*\([^)]*\)\s*/g, '') 
        
      if (countryToContinentMap[normalizedName]) {
        return countryToContinentMap[normalizedName];
      }
      
      for (const [key, continent] of Object.entries(countryToContinentMap)) {
        if (countryName.includes(key) || key.includes(countryName)) {
          return continent;
        }
      }
      
      logUnknownCountries(countryName);
      
      return null;
    }
    
    // Create tooltip
    const tooltip = d3.select("body")
      .append("div")
      .attr("class", "tooltip")
      .style("opacity", 0);
    
    // Load the world topology and our dataset
    Promise.all([
      d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
      d3.csv("us_foreign_budget_complete.csv")
    ]).then(([worldData, budgetData]) => {
      // Parse numeric values and filter data
      budgetData.forEach(d => {
        d.fiscal_year = +d["Fiscal Year"];
        d.current_amount = +d.current_amount || 0;
        d.country_name = d["Country Name"];
        d.region_name = d["Region Name"];
        d.category_name = d["US Category Name"] || "Uncategorized";
      });
      
      const filteredData = budgetData.filter(d => 
        d.current_amount > 0 && 
        d.country_name !== "World" && 
        d.country_name !== "Unassigned" &&
        d.country_name !== undefined && 
        d.country_name !== null && 
        d.country_name !== "" &&
        getContinent(d.country_name) !== null 
      );
      
      console.log(`Loaded ${filteredData.length} records with valid amounts and countries`);
      
      const years = [...new Set(filteredData.map(d => d.fiscal_year))].sort();
      
      const totalFunding = d3.sum(filteredData, d => d.current_amount);
      const uniqueCountries = new Set(filteredData.map(d => d.country_name)).size;
      
      document.getElementById('total-amount').textContent = '$' + d3.format(".2~s")(totalFunding).replace("G", "B");
      document.getElementById('countries-count').textContent = uniqueCountries;
      document.getElementById('continents-count').textContent = standardRegions.length;
      
      const yearSelect = document.getElementById('year-select');
      const allYearsOption = document.createElement('option');
      allYearsOption.value = "all";
      allYearsOption.textContent = "Fiscal Year: All Years";
      yearSelect.appendChild(allYearsOption);
      
      years.forEach(year => {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        yearSelect.appendChild(option);
      });
      
      yearSelect.value = "all";
      
      let activeData = filteredData;

      // Function to create the world map
      function createMap(worldData, data) {
        // Clear previous map
        d3.select("#map").html("");
        
        const width = d3.select("#map").node().getBoundingClientRect().width;
        const height = d3.select("#map").node().getBoundingClientRect().height;
        const margin = { top: 0, right: 0, bottom: 0, left: 0 }; // No margins
        
        // Calculate available space
        const innerWidth = width;
        const innerHeight = height;
        
        // Create SVG
        const svg = d3.select("#map")
          .append("svg")
          .attr("width", width)
          .attr("height", height)
          .attr("viewBox", [0, 0, width, height])
          .attr("style", "max-width: 100%; height: auto;")
          .on("click", reset);
        
        // Define zoom behavior
        const zoom = d3.zoom()
          .scaleExtent([1, 8])  // Min/max zoom level
          .on("zoom", zoomed);
        
        // Use Equal Earth projection for better area preservation
        const projection = d3.geoEqualEarth()
          .fitSize([innerWidth, innerHeight], 
                  topojson.feature(worldData, worldData.objects.countries))
          .translate([innerWidth / 2 + margin.left, innerHeight / 2 + margin.top]); // Better centering
        
        // Create path generator
        const path = d3.geoPath().projection(projection);
        
        // Calculate country totals
        const countryTotals = new Map();
        data.forEach(d => {
          const country = d.country_name;
          countryTotals.set(country, (countryTotals.get(country) || 0) + d.current_amount);
        });
        
        // Create a main container group that will be transformed during zoom
        const g = svg.append("g")
          .attr("transform", `translate(${margin.left},${margin.top})`);
        
        // Create map container groups
        const countries = g.append("g");
        const circles = g.append("g");
        
        // Draw country paths
        countries.selectAll("path")
          .data(topojson.feature(worldData, worldData.objects.countries).features)
          .join("path")
          .attr("class", "country")
          .attr("d", path)
          .attr("fill", d => {
            const continent = getContinent(d.properties.name);
            return continent ? colorScale(continent) : "#f0f0f0";
          })
          .on("click", clicked)
          .on("mouseover", function(event, d) {
            const countryName = d.properties.name;
            d3.select(this)
              .attr("stroke-width", 1.5)
              .attr("stroke", "#000");
            
            tooltip.transition()
              .duration(200)
              .style("opacity", 0.9);
            
            tooltip.html(`
              <strong>${countryName}</strong><br>
              Continent: ${getContinent(countryName) || "Unknown"}
            `)
              .style("left", (event.pageX + 10) + "px")
              .style("top", (event.pageY - 28) + "px");
          })
          .on("mouseout", function() {
            tooltip.transition()
              .duration(1500) // 1.5 seconds
              .style("opacity", 0);
          });
        
        // Add country name labels (hidden by default, shown when zoomed)
        countries.selectAll("text")
          .data(topojson.feature(worldData, worldData.objects.countries).features)
          .join("text")
          .attr("class", "country-label")
          .attr("transform", d => `translate(${path.centroid(d)})`)
          .text(d => d.properties.name);
        
        // Get positions for country circles
        const countryPositions = new Map();
        
        data.forEach(d => {
          const country = d.country_name;
          if (!countryPositions.has(country)) {
            const feature = topojson.feature(worldData, worldData.objects.countries).features
              .find(f => f.properties.name === country);
            
            if (feature) {
              const centroid = path.centroid(feature);
              if (!isNaN(centroid[0]) && !isNaN(centroid[1])) {
                countryPositions.set(country, centroid);
              }
            }
          }
        });
        
        // Create circle data for countries with valid positions
        const circleData = Array.from(countryTotals)
          .filter(([country, amount]) => countryPositions.has(country))
          .map(([country, amount]) => ({
            country,
            amount,
            position: countryPositions.get(country)
          }));
        
        // Calculate circle radius scale
        const maxAmount = d3.max(circleData, d => d.amount);
        
        // Create a better radius scale for the circles
        const radiusScale = d3.scaleSqrt()
          .domain([0, maxAmount])
          .range([2, Math.min(innerWidth, innerHeight) / 40]); // Adjust max radius relative to map size
        
        // Draw circles
        circles.selectAll("circle")
          .data(circleData)
          .join("circle")
          .attr("cx", d => d.position[0])
          .attr("cy", d => d.position[1])
          .attr("r", d => radiusScale(d.amount))
          .attr("class", d => `circle ${highlightedCountry === d.country ? 'highlighted' : ''}`)
          .attr("data-country", d => d.country) // Add data attribute for searching
          .attr("data-amount", d => d.amount) // Add data attribute for amount
          .attr("fill", d => {
            // If this country is highlighted, use the highlight color
            if (highlightedCountry === d.country) {
              return "#ff9900";
            }
            
            // Otherwise, use black for all circles
            return "#000";
          })
          .attr("fill-opacity", d => highlightedCountry === d.country ? 0.9 : 0.7)
          .attr("stroke", d => highlightedCountry === d.country ? "#ff9900" : "#fff")
          .attr("stroke-width", d => highlightedCountry === d.country ? 3 : 1)
          .on("mouseover", function(event, d) {
            let formattedValue = d3.format(".2~s")(d.amount).replace("G", "B");
            let tooltipContent = `<strong>${d.country}</strong><br>`;
            tooltipContent += `Total: $${formattedValue}`;
            d3.select(this)
              .attr("stroke-width", highlightedCountry === d.country ? 3 : 2);
            
            tooltip.transition()
              .duration(200)
              .style("opacity", 0.9);
            
            tooltip.html(tooltipContent)
              .style("left", (event.pageX + 10) + "px")
              .style("top", (event.pageY - 28) + "px");
          })
          .on("mouseout", function() {
            tooltip.transition()
              .duration(1500) // 1.5 seconds
              .style("opacity", 0);
          })
          .on("click", function(event, d) {
            // Prevent propagation to avoid triggering the map reset
            event.stopPropagation();
            // Use the shared country selection function
            selectCountry(d.country);
          });
        
        // Add continent labels
        const continentCentroids = {
          "North America": [-120, 40], // Move left
          "South America": [-80, -20], // Move left
          "Europe": [0, 50], // Move left
          "Africa": [10, 0], // Move left
          "Middle East": [40, 40], // Move left
          "Asia": [100, 40], // Move right
          "Australia and Oceania": [130, -25] // Move left
        };
        
        // Create continent labels
        const continentLabels = g.append("g");
        
        // Add background rectangles for labels
        continentLabels.selectAll("rect")
          .data(Object.entries(continentCentroids))
          .join("rect")
          .attr("transform", d => {
            const [x, y] = projection(d[1]);
            return `translate(${x - 50}, ${y - 10})`;
          })
          .attr("width", 100)
          .attr("height", 20)
          .attr("class", "continent-label-bg")
          .style("filter", "drop-shadow(1px 1px 1px rgba(0,0,0,0.2))")
          .attr("data-continent", d => d[0]); // Add data attribute for easier selection
        
        // Add the text labels
        continentLabels.selectAll("text")
          .data(Object.entries(continentCentroids))
          .join("text")
          .attr("transform", d => {
            const [x, y] = projection(d[1]);
            return `translate(${x}, ${y})`;
          })
          .attr("text-anchor", "middle")
          .attr("font-size", "12px")
          .attr("font-weight", "bold")
          .attr("dy", "0.35em")
          .attr("fill", d => {
            const continentColor = colorScale(d[0]);
            return continentColor;
          })
          .attr("class", "continent-label")
          .attr("data-continent", d => d[0]) // Add data attribute for easier selection
          .text(d => d[0]);
          
        // Apply zoom behavior
        svg.call(zoom);
        
        // Function to handle country clicks for zooming
        function clicked(event, d) {
          const [[x0, y0], [x1, y1]] = path.bounds(d);
          event.stopPropagation();
          
          // Only take action if we're not clicking the same area again
          if (expandedRegions.has(getContinent(d.properties.name)) && !highlightedCountry) {
            // If the region is already expanded and no country is highlighted, reset
            reset();
            expandedRegions.clear();
            
          } else {
            // Otherwise, zoom to the country
            const dx = x1 - x0;
            const dy = y1 - y0;
            const x = (x0 + x1) / 2;
            const y = (y0 + y1) / 2;
            const scale = Math.min(8, 0.9 / Math.max(dx / width, dy / height));
            const translate = [width / 2 - scale * x, height / 2 - scale * y];
            
            // Add this country's continent to expanded regions
            const continent = getContinent(d.properties.name);
            if (continent) {
              expandedRegions.clear(); // Clear previous regions
              expandedRegions.add(continent);
            }
            
            svg.transition()
              .duration(750)
              .call(
                zoom.transform,
                d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
              );
          }
        }
        
        // Function to reset zoom
        function reset() {
          // Reset the zoom
          svg.transition().duration(750).call(
            zoom.transform,
            d3.zoomIdentity,
            d3.zoomTransform(svg.node()).invert([width / 2, height / 2])
          );
          
          // If there's a country highlighted, reset that as well
          if (highlightedCountry || expandedRegions.size > 0) {
            resetVisualizations();
          }
        }
        
        // Function to handle zoom events
        function zoomed(event) {
          const { transform } = event;
          g.attr("transform", transform);
          
          // Adjust stroke width based on zoom level
          g.selectAll(".country").attr("stroke-width", 0.5 / transform.k);
          g.selectAll("circle").attr("stroke-width", function() {
            const baseWidth = d3.select(this).classed("highlighted") ? 3 : 1;
            return baseWidth / transform.k;
          });
          
          // Show/hide country labels based on zoom level
          g.selectAll(".country-label")
            .style("display", transform.k > 3 ? "block" : "none")
            .style("font-size", `${8 / transform.k}px`);
          
          // Adjust circle radius based on zoom level
          g.selectAll("circle").attr("r", d => radiusScale(d.amount) / transform.k);
          
          // Scale continent labels
          g.selectAll(".continent-label")
            .style("font-size", `${12 / transform.k}px`);
          
          // Scale and position the background rectangles
          g.selectAll(".continent-label-bg")
            .attr("width", 100 / transform.k)
            .attr("height", 20 / transform.k)
            .attr("transform", function(d) {
              const [x, y] = projection(d[1]);
              return `translate(${x - 50 / transform.k}, ${y - 10 / transform.k})`;
            });
            
          // Reposition the continent text labels
          g.selectAll(".continent-label")
            .attr("transform", function(d) {
              const [x, y] = projection(d[1]);
              return `translate(${x}, ${y})`;
            });
            
          // Hide continent labels when zoomed in too far
          const continentLabelsDisplay = transform.k > 3 ? "none" : "block";
          g.selectAll(".continent-label, .continent-label-bg")
            .style("display", continentLabelsDisplay);
        }
      }
      
      // Function to create the Sankey diagram
      function createSankeyDiagram(data, highlightedCountryParam = null) {
        try {
          // Ensure the diagram has proper initial state
          console.log("Creating Sankey diagram...");
          
          // Use the parameter to update the global variable if provided
          if (highlightedCountryParam !== null) {
            highlightedCountry = highlightedCountryParam;
            console.log(`Setting highlighted country to: ${highlightedCountry}`);
          }
          
          // Clear previous diagram
          d3.select("#sankey-diagram").html("");
          
          // **START OF CHANGES**
          // Filter data for highlighted country before creating the Sankey nodes and links
          let dataToUse = data;
          
          // Store original data for tooltips and calculations
          const originalData = data;
          
          // If a country is highlighted, filter the data to show only flows for that country
          if (highlightedCountry) {
            dataToUse = data.filter(d => d.country_name === highlightedCountry);
            console.log(`Filtered to ${dataToUse.length} rows for ${highlightedCountry}`);
            
            // If no data for this country, fall back to all data with a warning
            if (dataToUse.length === 0) {
              console.warn(`No data found for ${highlightedCountry}, using full dataset`);
              dataToUse = data;
            }
          }
          // **END OF CHANGES**
          
          // Process data for Sankey (Categories -> Regions -> Countries)
          const topCategoriesCount = 8; // Limit to top categories
          const minAmountForDisplay = 1000000; // Minimum funding amount for individual display (1 million)
          
          // Further filter out any remaining "World" or "Unassigned" entries just to be safe
          dataToUse = dataToUse.filter(d => 
            d.country_name !== "World" && 
            d.country_name !== "Unassigned" &&
            d.country_name !== undefined && 
            d.country_name !== null && 
            d.country_name !== ""
          );
          
          // Check if we have data to process
          if (dataToUse.length === 0) {
            console.error("No valid data to display in Sankey diagram");
            d3.select("#sankey-diagram").html(
              `<div style="padding: 20px; color: red;">No valid data to display. Please check filters.</div>`
            );
            return;
          }
          
          // 1. Calculate country totals - USE FILTERED DATA
          const countryTotals = d3.rollup(
            dataToUse,
            v => d3.sum(v, d => d.current_amount),
            d => d.country_name
          );
          
          // Get countries by amount
          const allCountries = Array.from(countryTotals, ([country, amount]) => ({
            country,
            amount
          }))
          .sort((a, b) => b.amount - a.amount);
          
          // Split countries into displayed and grouped as "Other"
          const displayedCountries = allCountries.filter(c => c.amount >= minAmountForDisplay);
          const otherCountries = allCountries.filter(c => c.amount < minAmountForDisplay);
          
          // Calculate total for "Other Countries"
          const otherAmount = d3.sum(otherCountries, d => d.amount);
          
          // Log stats for debugging
          console.log(`Displaying ${displayedCountries.length} countries individually`);
          console.log(`Grouping ${otherCountries.length} countries as "Other" (total: $${d3.format(",.0f")(otherAmount)})`);
          
          // Final countries array including "Other" if needed
          const finalCountries = [...displayedCountries];
          if (otherAmount > 0) {
            finalCountries.push({ country: "Other Countries", amount: otherAmount });
          }
          
          // Update country counter
          // document.getElementById('sankey-countries').textContent = 
          //   `${displayedCountries.length}/${allCountries.length}`;
          
          // 2. Calculate category totals - USE FILTERED DATA
          const categoryTotals = d3.rollup(
            dataToUse,
            v => d3.sum(v, d => d.current_amount),
            d => d.category_name
          );
          
          // Get top categories by amount
          const topCategories = Array.from(categoryTotals, ([category, amount]) => ({
            category,
            amount
          }))
          .sort((a, b) => b.amount - a.amount)
          .slice(0, topCategoriesCount);
          
          // Limit number of countries displayed when expanded to prevent overcrowding
          const maxCountriesWhenExpanded = 30;
          
          // 4. Calculate region totals - USE FILTERED DATA
          const regionTotals = d3.rollup(
            dataToUse,
            v => d3.sum(v, d => d.current_amount),
            d => getContinent(d.country_name) || "Unassigned"
          );
          
          // Get all regions by amount
          const allRegions = Array.from(regionTotals, ([region, amount]) => ({
            region,
            amount
          }))
          .sort((a, b) => b.amount - a.amount);
          
          // Prepare nodes and links
          const nodes = [];
          const links = [];
          
          // Add Total Budget node
          const totalBudgetNode = { 
            name: "Total Budget", 
            id: "total-budget",
            type: "total"
          };
          nodes.push(totalBudgetNode);
          
          // Add category nodes
          const categoryNodes = topCategories.map(c => ({ 
            name: c.category, 
            id: `category-${c.category}`,
            type: "category"
          }));
          nodes.push(...categoryNodes);
          
          // Add region nodes
          const regionNodes = allRegions.map(r => ({ 
            name: r.region, 
            id: `region-${r.region}`,
            type: "region",
            expanded: expandedRegions.has(r.region)
          }));
          nodes.push(...regionNodes);
          
          // Add country nodes based on expanded regions
          const countryNodes = [];
          finalCountries.forEach(c => {
            if (!c.country) return; // Skip if country is undefined
            
            const continent = getContinent(c.country);
            // Only add countries for expanded regions
            if (expandedRegions.has(continent)) {
              countryNodes.push({
                name: c.country,
                id: `country-${c.country}`,
                type: "country",
                region: continent
              });
            }
          });
          nodes.push(...countryNodes);
          
          // Create node index map for easier reference
          const nodeMap = new Map();
          nodes.forEach((node, i) => {
            node.index = i;
            nodeMap.set(node.id, i);
          });
          
          // Create links from Total Budget to Categories
          topCategories.forEach(category => {
            const sourceNode = nodeMap.get("total-budget");
            const targetNode = nodeMap.get(`category-${category.category}`);
            if (sourceNode !== undefined && targetNode !== undefined) {
              links.push({
                source: sourceNode,
                target: targetNode,
                value: category.amount
              });
            }
          });
          
          // Add direct links from categories to regions to replace the removed agency links
          // Categories to Regions links
          // Group data by category and region
          const categoryRegionTotals = d3.rollup(
            dataToUse,
            v => d3.sum(v, d => d.current_amount),
            d => d.category_name,
            d => getContinent(d.country_name) || "Unassigned"
          );
          
          // Create links for each category to regions
          topCategories.forEach(category => {
            const regionMap = categoryRegionTotals.get(category.category);
            if (regionMap) {
              allRegions.forEach(region => {
                const amount = regionMap.get(region.region) || 0;
                if (amount > 0) {
                  const sourceNode = nodeMap.get(`category-${category.category}`);
                  const targetNode = nodeMap.get(`region-${region.region}`);
                  if (sourceNode !== undefined && targetNode !== undefined) {
                    links.push({
                      source: sourceNode,
                      target: targetNode,
                      value: amount,
                      region: region.region
                    });
                  }
                }
              });
            }
          });
          
          // If any regions are expanded, add links to countries
          // Regions to Countries links
          // Group data by region and country
          const regionCountryTotals = d3.rollup(
            dataToUse,
            v => d3.sum(v, d => d.current_amount),
            d => getContinent(d.country_name) || "Unassigned",
            d => d.country_name
          );
          
          // Create links from expanded regions to their countries
          allRegions.forEach(region => {
            // Only process regions that are expanded

              return;
            }
            
            const countryMap = regionCountryTotals.get(region.region);
            if (countryMap) {
              // Handle displayed countries
              displayedCountries.forEach(country => {
                // Only consider countries in this region
                if (getContinent(country.country) !== region.region) {
                  return;
                }
                
                const amount = countryMap.get(country.country) || 0;
                if (amount > 0) {
                  const sourceNode = nodeMap.get(`region-${region.region}`);
                  const targetNode = nodeMap.get(`country-${country.country}`);
                  if (sourceNode !== undefined && targetNode !== undefined) {
                    links.push({
                      source: sourceNode,
                      target: targetNode,
                      value: amount,
                      country: country.country
                    });
                  }
                }
              });
              
              // Handle "Other Countries" if present
              if (otherAmount > 0) {
                // Calculate total for this region to other countries
                let regionToOtherAmount = 0;
                otherCountries.forEach(country => {
                  if (getContinent(country.country) === region.region) {
                    regionToOtherAmount += countryMap.get(country.country) || 0;
                  }
                });
                
                if (regionToOtherAmount > 0) {
                  const sourceNode = nodeMap.get(`region-${region.region}`);
                  const targetNode = nodeMap.get(`country-Other Countries`);
                  if (sourceNode !== undefined && targetNode !== undefined) {
                    links.push({
                      source: sourceNode,
                      target: targetNode,
                      value: regionToOtherAmount,
                      country: "Other Countries"
                    });
                  }
                }
              }
            }
          });
          
          // Set up Sankey diagram dimensions
          const width = Math.min(1800, window.innerWidth * 0.90);
          const height = 820;
          const margin = { top: 30, right: 190, bottom: 30, left: 40 };
          
          // Create SVG
          const svg = d3.select("#sankey-diagram")
            .append("svg")
            .attr("width", width)
            .attr("height", height);
          
          // Fix the duplicate sankey variable declaration by moving the logic to before the first sankey creation
          // Replace the original sankey creation:
          const sankey = d3.sankey()
            .nodeId(d => d.index)
            .nodeWidth(10)
            .nodePadding(expandedRegions.size > 0 ? 10 : 8) // Adjust padding for better vertical distribution
            .extent([[margin.left, margin.top], [width - margin.right, height - margin.bottom]]);
          
          // Generate layout
          const sankeyData = sankey({
            nodes: nodes,
            links: links
          });
          
          // Add special handling for Africa region
          if (expandedRegions.size > 0) {
            const expandedRegionName = Array.from(expandedRegions)[0];

            // Log country nodes and their values to debug issues with Africa

            // Sort country nodes by amount for better visualization

      // Function to initialize search functionality
      function initSearchFunctionality(worldData, activeData) {
        const searchInput = document.getElementById('country-search');
        const searchResults = document.getElementById('search-results');
        
        // Build a list of all unique countries with their total amounts
        const countryTotals = d3.rollup(
          activeData,
          v => d3.sum(v, d => d.current_amount),
          d => d.country_name
        );
        
        // Create a list of searchable countries
        allCountriesForSearch = Array.from(countryTotals, ([country, amount]) => ({
          country,
          amount,
          continent: getContinent(country)
        })).sort((a, b) => a.country.localeCompare(b.country));
        
        // Add event listeners
        searchInput.addEventListener('input', performSearch);
        searchInput.addEventListener('focus', performSearch);
        searchInput.addEventListener('keydown', handleSearchKeydown);
        
        // Handle clicks outside the search results to close them
        document.addEventListener('click', function(event) {
          if (!searchInput.contains(event.target) && !searchResults.contains(event.target)) {
            searchResults.style.display = 'none';
            searchResultsVisible = false;
          }
        });
        
        // Search function
        function performSearch() {
          const query = searchInput.value.trim().toLowerCase();
          
          // If the query is empty, hide results
          if (query.length === 0) {
            searchResults.style.display = 'none';
            searchResultsVisible = false;
            return;
          }
          
          // Filter countries based on query
          const matches = allCountriesForSearch.filter(item => 
            item.country.toLowerCase().includes(query)
          ).slice(0, 10); // Limit to 10 results
          
          // Clear previous results
          searchResults.innerHTML = '';
          
          // If we have matches, populate and show results
          if (matches.length > 0) {
            matches.forEach(match => {
              const resultItem = document.createElement('div');
              resultItem.className = 'search-result-item';
              resultItem.innerHTML = `
                <div class="country-marker" style="background-color: ${colorScale(match.continent)}"></div>
                <div class="country-name">${match.country}</div>
                <div class="country-amount">$${d3.format(".2~s")(match.amount).replace("G", "B")}</div>
              `;
              
              resultItem.addEventListener('click', () => {
                // Set the input value to the selected country
                searchInput.value = match.country;
                
                // Hide search results
                searchResults.style.display = 'none';
                searchResultsVisible = false;
                
                // Find and zoom to country on map
                zoomToCountry(worldData, match.country);
              });
              
              searchResults.appendChild(resultItem);
            });
            
            searchResults.style.display = 'block';
            searchResultsVisible = true;
          } else {
            searchResults.style.display = 'none';
            searchResultsVisible = false;
          }
        }
        
        // Handle keyboard navigation in search results
        function handleSearchKeydown(event) {
          if (!searchResultsVisible) return;
          
          const resultItems = searchResults.querySelectorAll('.search-result-item');
          const activeItem = searchResults.querySelector('.search-result-item.active');
          let activeIndex = -1;
          
          if (activeItem) {
            activeIndex = Array.from(resultItems).indexOf(activeItem);
          }
          
          switch (event.key) {
            case 'ArrowDown':
              event.preventDefault();
              if (activeIndex < resultItems.length - 1) {
                if (activeItem) activeItem.classList.remove('active');
                resultItems[activeIndex + 1].classList.add('active');
                resultItems[activeIndex + 1].scrollIntoView({ block: 'nearest' });
              }
              break;
              
            case 'ArrowUp':
              event.preventDefault();
              if (activeIndex > 0) {
                if (activeItem) activeItem.classList.remove('active');
                resultItems[activeIndex - 1].classList.add('active');
                resultItems[activeIndex - 1].scrollIntoView({ block: 'nearest' });
              }
              break;
              
            case 'Enter':
              event.preventDefault();
              if (activeItem) {
                activeItem.click();
              } else if (resultItems.length > 0) {
                // If no item is active, select the first one
                resultItems[0].click();
              }
              break;
              
            case 'Escape':
              event.preventDefault();
              searchResults.style.display = 'none';
              searchResultsVisible = false;
              break;
          }
        }
      }
      
      // Function to zoom to a specific country
      function zoomToCountry(worldData, countryName) {
        // Find the country feature
        const countryFeature = topojson.feature(worldData, worldData.objects.countries).features
          .find(f => f.properties.name === countryName);
        
        if (!countryFeature) {
          console.warn(`Country not found: ${countryName}`);
          return;
        }
        
        // Select the country (highlight it across all visualizations)
        selectCountry(countryName);
        
        // Since selectCountry already updates the map with zooming, we don't need
        // to do additional zooming here
      }
    }).catch(error => {

      document.getElementById('map').innerHTML = 
        `<p style="color: red; padding: 20px;">Error loading data: ${error.message}</p>`;
      document.getElementById('sankey-diagram').innerHTML =

    // Function to create the bubble chart for funding by category and agency
    function createBubbleChart(data) {
      // Debug log to check if the function is being called
      console.log("createBubbleChart function called with", data.length, "records");
      
      // Clear previous chart
      d3.select("#bubble-chart").html("");
      
      const width = d3.select("#bubble-chart").node().getBoundingClientRect().width;
      const height = d3.select("#bubble-chart").node().getBoundingClientRect().height;
      const margin = { top: 20, right: 100, bottom: 80, left: 60 };
      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;
      
      // Create SVG
      const svg = d3.select("#bubble-chart")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);
      
      // Process data - group by category and agency
      const processedData = [];
      
      // Group data by Category and Agency
      const groupedData = d3.group(data, d => d.category_name, d => d.agency_name);
      
      // Convert the nested Map to array of objects
      groupedData.forEach((agencies, category) => {
        if (category && category !== "null" && category !== "undefined") {
          agencies.forEach((records, agency) => {
            if (agency && agency !== "null" && agency !== "undefined") {
              const totalAmount = d3.sum(records, d => d.current_amount);
              const projects = records.length;
              
              processedData.push({
                category: category,
                agency: agency,
                amount: totalAmount,
                projects: projects
              });
            }
          });
        }
      });
      
      // Sort data by amount and take top entries for readability
      processedData.sort((a, b) => b.amount - a.amount);
      
      // Get unique categories and agencies
      const categories = Array.from(new Set(processedData.map(d => d.category)));
      const agencies = Array.from(new Set(processedData.map(d => d.agency)));
      
      // Get top categories and top agencies by amount
      const topCategories = Array.from(
        d3.rollup(
          processedData,
          v => d3.sum(v, d => d.amount),
          d => d.category
        )
      )
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10)
        .map(d => d[0]);
      
      const topAgencies = Array.from(
        d3.rollup(
          processedData,
          v => d3.sum(v, d => d.amount),
          d => d.agency
        )
      )
        .sort((a, b) => b[1] - a[1])
        .slice(0, 15)
        .map(d => d[0]);
      
      // Filter data to only include top categories and agencies
      const filteredData = processedData.filter(
        d => topCategories.includes(d.category) && topAgencies.includes(d.agency)
      );
      
      // Create scales
      const xScale = d3.scaleBand()
        .domain(topCategories)
        .range([0, innerWidth])
        .padding(0.2);
      
      const yScale = d3.scaleLog()
        .domain([
          Math.max(1000, d3.min(filteredData, d => d.amount) / 2),
          d3.max(filteredData, d => d.amount) * 1.2
        ])
        .range([innerHeight, 0])
        .nice();
      
      // Bubble size scale
      const radiusScale = d3.scaleSqrt()
        .domain([0, d3.max(filteredData, d => d.amount)])
        .range([3, 30]);
      
      // Create color scale for agencies
      const colorScale = d3.scaleOrdinal()
        .domain(topAgencies)
        .range(d3.schemeTableau10);
      
      // Create axes
      const xAxis = d3.axisBottom(xScale);
      const yAxis = d3.axisLeft(yScale)
        .ticks(5)
        .tickFormat(d => {
          const format = d3.format(".1s");
          return "$" + format(d).replace("G", "B");
        });
      
      // Add axes to SVG
      svg.append("g")
        .attr("class", "x-axis")
        .attr("transform", `translate(0,${innerHeight})`)
        .call(xAxis)
        .selectAll("text")
        .attr("transform", "rotate(-45)")
        .style("text-anchor", "end")
        .attr("dx", "-.8em")
        .attr("dy", ".15em")
        .style("font-size", "10px");
      
      svg.append("g")
        .attr("class", "y-axis")
        .call(yAxis);
      
      // Add axis labels
      svg.append("text")
        .attr("class", "y-axis-label")
        .attr("transform", "rotate(-90)")
        .attr("y", -margin.left + 15)
        .attr("x", -innerHeight / 2)
        .attr("text-anchor", "middle")
        .text("Funding Amount ($)");
      
      svg.append("text")
        .attr("class", "x-axis-label")
        .attr("x", innerWidth / 2)
        .attr("y", innerHeight + margin.bottom - 10)
        .attr("text-anchor", "middle")
        .text("US Category");
      
      // Add bubbles
      svg.selectAll(".bubble")
        .data(filteredData)
        .join("circle")
        .attr("class", "bubble")
        .attr("cx", d => xScale(d.category) + xScale.bandwidth() / 2)
        .attr("cy", d => yScale(Math.max(1000, d.amount)))
        .attr("r", d => radiusScale(d.amount))
        .attr("fill", d => colorScale(d.agency))
        .attr("fill-opacity", 0.7)
        .attr("stroke", "#fff")
        .attr("stroke-width", 1)
        .on("mouseover", function(event, d) {
          d3.select(this)
            .attr("stroke", "#000")
            .attr("stroke-width", 2)
            .attr("fill-opacity", 0.9);
          
          tooltip.transition()
            .duration(200)
            .style("opacity", 0.9);
          
          tooltip.html(`
            <strong>Category:</strong> ${d.category}<br>
            <strong>Agency:</strong> ${d.agency}<br>
            <strong>Amount:</strong> $${d3.format(",")(Math.round(d.amount))}<br>
            <strong>Projects:</strong> ${d.projects}
          `)
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 28) + "px");
        })
        .on("mouseout", function() {
          d3.select(this)
            .attr("stroke", "#fff")
            .attr("stroke-width", 1)
            .attr("fill-opacity", 0.7);
          
          tooltip.transition()
            .duration(500)
            .style("opacity", 0);
        });
      
      // Add legend for top agencies
      const legendTop = 20;
      const legendRight = innerWidth + 15;
      const legendCircleRadius = 6;
      const legendSpacing = 20;
      
      const legend = svg.selectAll(".legend")
        .data(topAgencies.slice(0, 7)) // Show top 7 agencies in legend
        .join("g")
        .attr("class", "legend")
        .attr("transform", (d, i) => `translate(${legendRight},${legendTop + i * legendSpacing})`);
      
      legend.append("circle")
        .attr("r", legendCircleRadius)
        .attr("fill", d => colorScale(d))
        .attr("fill-opacity", 0.7);
      
      legend.append("text")
        .attr("x", legendCircleRadius * 1.5)
        .attr("y", legendCircleRadius / 2)
        .text(d => {
          // Truncate long agency names
          return d.length > 20 ? d.substring(0, 18) + "..." : d;
        })
        .style("font-size", "9px");
      
      // Add title
      svg.append("text")
        .attr("x", innerWidth / 2)
        .attr("y", -5)
        .attr("text-anchor", "middle")
        .attr("font-size", "14px")
        .attr("font-weight", "bold")
        .text("Funding by Category and Agency");
      
      // Add "more agencies" text if we've truncated the legend
      if (topAgencies.length > 7) {
        svg.append("text")
          .attr("x", legendRight)
          .attr("y", legendTop + 7 * legendSpacing + 10)
          .style("font-size", "9px")
          .style("font-style", "italic")
          .text(`+ ${topAgencies.length - 7} more agencies`);
      }
    }

    // Function to create the bar chart visualization
    // Function to create the treemap visualization
    function createTreemap(data) {
      console.log("Creating treemap with", data ? data.length : 0, "records");
      
      // Clear previous treemap
      d3.select("#treemap").html("");
      
      // Check if we have valid data
      if (!data || data.length === 0) {
        console.warn("No data provided to createTreemap");
        d3.select("#treemap").html("<p style='color: red; padding: 20px;'>No valid data to display</p>");
        return;
      }
      
      try {
        // Define income group colors
        const incomeColors = {
          "Low Income Country": "#e78ac3", // pinkish
          "Lower Middle Income Country": "#8da0cb", // blueish
          "Upper Middle Income Country": "#fc8d62", // orangeish
          "High Income Country": "#66c2a5" // greenish
        };
        
        // Process data for a flat list of countries (no region hierarchy)
        const hierarchyData = prepareCountryData(data, incomeColors);
        
        // Set up dimensions
        const width = document.getElementById("treemap").clientWidth;
        const height = document.getElementById("treemap").clientHeight;
        
        // Create treemap layout
        const treemap = d3.treemap()
          .size([width, height])
          .paddingOuter(3)
          .paddingTop(0) 
          .paddingInner(2)
          .round(true);
        
        // Compute the treemap layout
        treemap(hierarchyData);
        
        // Create SVG
        const svg = d3.select("#treemap")
          .append("svg")
          .attr("width", width)
          .attr("height", height);
        
        // Create groups for each cell
        const nodes = svg.selectAll("g")
          .data(hierarchyData.descendants().filter(d => d.depth === 1)) // Only get country nodes (depth 1)
          .join("g")
          .attr("transform", d => `translate(${d.x0},${d.y0})`);
        
        // Add rectangles for each country
        nodes.append("rect")
          .attr("class", d => {
            let classes = "node country";
            if (highlightedCountry === d.data.name) {
              classes += " highlighted";
            } else if (highlightedCountry && highlightedCountry !== d.data.name) {
              classes += " faded";
            }
            return classes;
          })
          .attr("width", d => d.x1 - d.x0)
          .attr("height", d => d.y1 - d.y0)
          .attr("fill", d => incomeColors[d.data.incomeGroup] || "#999") // Color by income group
          .attr("stroke", "#fff")
          .attr("stroke-width", 1)
          .on("mouseover", function(event, d) {
            // Add hover effects
            d3.select(this)
              .attr("stroke", "#000")
              .attr("stroke-width", 3);
            
            // Show tooltip
            const tooltipContent = `<strong>Country:</strong> ${d.data.name}<br>
              <strong>Region:</strong> ${d.data.region || "Unknown"}<br>
              <strong>Income Group:</strong> ${d.data.incomeGroup}<br>
              <strong>Total Amount:</strong> $${d3.format(".2~s")(Math.round(d.value)).replace("G", "B").replace("T", "T")}`;
            
            tooltip.transition()
              .duration(200)
              .style("opacity", 0.9);
            
            tooltip.html(tooltipContent)
              .style("left", (event.pageX + 10) + "px")
              .style("top", (event.pageY - 28) + "px");
          })
          .on("mouseout", function() {
            // Remove hover effects
            d3.select(this)
              .attr("stroke", "#fff")
              .attr("stroke-width", 1);
            
            // Hide tooltip
            tooltip.transition()
              .duration(500)
              .style("opacity", 0);
          })
          .on("click", function(event, d) {
            // Use the existing selectCountry function
            selectCountry(d.data.name);
          });
        
        // Add labels
        nodes.append("text")
          .attr("class", d => {
            let classes = "node-label";
            if (highlightedCountry === d.data.name) {
              classes += " highlighted";
            } else if (highlightedCountry && highlightedCountry !== d.data.name) {
              classes += " faded";
            }
            return classes;
          })
          .attr("x", d => (d.x1 - d.x0) / 2)
          .attr("y", d => (d.y1 - d.y0) / 2)
          .attr("dy", "0.35em")
          .attr("text-anchor", "middle")
          .attr("font-size", "10px")
          .attr("fill", "white")
          .attr("text-shadow", "0px 0px 2px rgba(0,0,0,0.7)")
          .text(d => {
            const width = d.x1 - d.x0;
            const height = d.y1 - d.y0;
            
            // Only show country labels if the cell is big enough
            if (width > 40 && height > 25) {
              return d.data.name;
            }
            return "";
          });
        
        // Update the legend
        updateTreemapLegend(incomeColors);
        
      } catch (error) {
        console.error("Error creating treemap:", error);
        d3.select("#treemap").html(`<p style='color: red; padding: 20px;'>Error creating treemap: ${error.message}</p>`);
      }
    }
    
    // Function to prepare flat country data for treemap
    function prepareCountryData(data, incomeColors) {
      // Group data by country
      const countryMap = d3.group(data, d => d["Country Name"]);
      
      // Create the flat structure
      const rootData = { name: "World", children: [] };
      
      // Process countries
      countryMap.forEach((entries, country) => {
        // Calculate total amount for this country
        const total = d3.sum(entries, d => +d.current_amount);
        
        // Skip countries with null or zero current_amount
        if (!total || isNaN(total) || total <= 0) return;
        
        // Get region and income group (use most common one if multiple exist)
        const regionCounts = new Map();
        const incomeGroupCounts = new Map();
        
        entries.forEach(entry => {
          const region = entry["Region Name"] || "Unspecified";
          const group = entry["Income Group Name"];
          
          // Skip if group is null, empty, or "Unspecified"
          if (!group || group === "Unspecified") return;
          
          regionCounts.set(region, (regionCounts.get(region) || 0) + 1);
          incomeGroupCounts.set(group, (incomeGroupCounts.get(group) || 0) + 1);
        });
        
        // Skip if no valid income group found
        if (incomeGroupCounts.size === 0) return;
        
        const region = regionCounts.size > 0 
          ? Array.from(regionCounts.entries()).sort((a, b) => b[1] - a[1])[0][0] 
          : "Unknown"; // Get most common region
        
        const incomeGroup = Array.from(incomeGroupCounts.entries())
          .sort((a, b) => b[1] - a[1])[0][0]; // Get most common income group
        
        // Skip if income group is not in our defined colors
        if (!incomeColors[incomeGroup]) return;
        
        // Add country to root
        rootData.children.push({
          name: country,
          value: total,
          region: region,
          incomeGroup: incomeGroup
        });
      });
      
      // Sort countries by funding amount
      rootData.children.sort((a, b) => b.value - a.value);
      
      // Convert to d3 hierarchy
      return d3.hierarchy(rootData)
        .sum(d => d.value);
    }
    
    // Function to update the treemap legend
    function updateTreemapLegend(incomeColors) {
      const legendContainer = d3.select("#treemap-legend");
      legendContainer.html("");
      
      // Show income group legend
      const legendData = Object.entries(incomeColors);
      
      legendData.forEach(([key, color]) => {
        const item = legendContainer.append("div")
          .attr("class", "legend-item");
        
        item.append("div")
          .attr("class", "legend-color")
          .style("background-color", color);
        
        item.append("span")
          .text(key);
      });
    }
    
    // Function to update all visualizations
    function updateVisualizations(year) {
      // Filter data by year if needed
      let filteredData = budgetData;
      
      if (year !== "all") {
        year = +year; // Convert to number
        filteredData = budgetData.filter(d => d.fiscal_year === year);
      }
      
      // Update stats
      updateStats(filteredData);
      
      // Update visualizations
      createMap(filteredData);
      createTreemap(filteredData); // Use treemap instead of bar chart
      createSankeyDiagram(filteredData);
    }

    // Calculate proportions for sector-to-region links when a country is highlighted
    let sectorProportions = new Map(); // Store proportions for each sector-region pair

    if (highlightedCountry) {
      const countryRegion = getContinent(highlightedCountry);
      console.log(`Highlighted country: ${highlightedCountry}, Region: ${countryRegion}`);
      
      // Step 1: Calculate how much each sector contributes to the highlighted country
      let sectorToCountryAmounts = new Map();
      let sectorToRegionAmounts = new Map();
      
      // Process all data to get amounts
      filteredData.forEach(d => {
        if (d.current_amount <= 0) return; // Skip zero/negative amounts
        
        const sector = d.category_name;
        const country = d.country_name;
        const region = getContinent(country);
        
        // Only process data for the highlighted country's region
        if (region === countryRegion) {
          // Add to region total for this sector
          const currentRegionAmount = sectorToRegionAmounts.get(sector) || 0;
          sectorToRegionAmounts.set(sector, currentRegionAmount + d.current_amount);
          
          // If this is the highlighted country, add to country total for this sector
          if (country === highlightedCountry) {
            const currentCountryAmount = sectorToCountryAmounts.get(sector) || 0;
            sectorToCountryAmounts.set(sector, currentCountryAmount + d.current_amount);
          }
        }
      });
      
      // Step 2: Calculate proportions (what percentage of sector→region flow goes to highlighted country)
      sectorToRegionAmounts.forEach((regionAmount, sector) => {
        const countryAmount = sectorToCountryAmounts.get(sector) || 0;
        if (regionAmount > 0) {
          const proportion = countryAmount / regionAmount;
          const key = `${sector}-${countryRegion}`;
          sectorProportions.set(key, proportion);
          console.log(`Sector: ${sector}, Proportion to ${highlightedCountry}: ${proportion.toFixed(4)}`);
        }
      });
    }

    // Step 1: Add this where you process data for the Sankey diagram
    // (right after you determine the highlighted country)

    // Calculate sector-to-country proportions for highlighting
    let sectorToCountryMap = new Map();
    let sectorToRegionMap = new Map();

    if (highlightedCountry) {
      const countryRegion = getContinent(highlightedCountry);
      console.log(`Highlighting proportions for: ${highlightedCountry} in ${countryRegion}`);
      
      // Group data by sector, region, and country to calculate proportions
      filteredData.forEach(d => {
        if (d.current_amount <= 0) return;
        
        const sector = d.category_name;
        const region = getContinent(d.country_name);
        
        // Skip if not relevant to our calculation
        if (region !== countryRegion) return;
        
        // Add to sector-to-region map
        const regionKey = `${sector}-${region}`;
        sectorToRegionMap.set(
          regionKey, 
          (sectorToRegionMap.get(regionKey) || 0) + d.current_amount
        );
        
        // If this is our highlighted country, add to sector-to-country map
        if (d.country_name === highlightedCountry) {
          const countryKey = `${sector}-${highlightedCountry}`;
          sectorToCountryMap.set(
            countryKey,
            (sectorToCountryMap.get(countryKey) || 0) + d.current_amount
          );
        }
      });
      
      // Log the calculated values for debugging
      sectorToRegionMap.forEach((value, key) => {
        const [sector, region] = key.split('-');
        const countryKey = `${sector}-${highlightedCountry}`;
        const countryValue = sectorToCountryMap.get(countryKey) || 0;
        if (countryValue > 0) {
          const proportion = countryValue / value;
          console.log(`Sector: ${sector}, Proportion to ${highlightedCountry}: ${(proportion * 100).toFixed(2)}%`);
        }
      });
    }
